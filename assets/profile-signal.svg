<svg xmlns="http://www.w3.org/2000/svg" width="900" height="48" viewBox="0 0 900 48">
  <defs>
    <linearGradient id="track">
      <stop stop-color="#15536b" stop-opacity="0"/>
      <stop offset=".3" stop-color="#15536b"/>
      <stop offset=".7" stop-color="#15536b"/>
      <stop offset="1" stop-color="#15536b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="-74" x2="74" y1="24" y2="24">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <style>
      .scan { animation: scan 5.6s ease-in-out 3 both; }
      .ring { transform-box: fill-box; transform-origin: center; animation: ripple 2.8s ease-out 6 both; }
      @keyframes scan {
        0% { transform: translateX(125px); opacity: 0; }
        15%, 78% { opacity: 1; }
        100% { transform: translateX(775px); opacity: 0; }
      }
      @keyframes ripple {
        0% { transform: scale(.65); opacity: .8; }
        80%, 100% { transform: scale(1.85); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .scan, .ring { animation: none; display: none; }
      }
    </style>
  </defs>
  <path d="M24 24H876" stroke="url(#track)" stroke-width="2"/>
  <g fill="#278299">
    <circle cx="210" cy="24" r="3"/>
    <circle cx="330" cy="24" r="3"/>
    <circle cx="570" cy="24" r="3"/>
    <circle cx="690" cy="24" r="3"/>
  </g>
  <path class="scan" d="M-74 24H74" stroke="url(#pulse)" stroke-width="3" opacity="0"/>
  <circle cx="450" cy="24" r="12" fill="#0b2131" stroke="#20859d"/>
  <circle class="ring" cx="450" cy="24" r="10" fill="none" stroke="#22d3ee" opacity="0"/>
  <path d="M450 18l6 6-6 6-6-6z" fill="#67e8f9"/>
</svg>
